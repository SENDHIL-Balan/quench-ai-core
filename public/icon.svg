<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141c30" />
      <stop offset="100%" stop-color="#0a0c14" />
    </radialGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <radialGradient id="core" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="80%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <filter id="blurHalo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#bg)" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#glow)" stroke-width="8" opacity="0.4" filter="url(#blurHalo)" />
  <circle cx="256" cy="256" r="140" fill="url(#core)" />
  <ellipse cx="256" cy="256" rx="180" ry="60" fill="none" stroke="url(#glow)" stroke-width="6" opacity="0.85" transform="rotate(-28 256 256)" />
  <circle cx="256" cy="256" r="42" fill="#ffffff" opacity="0.95" filter="url(#blurHalo)" />
  <circle cx="256" cy="256" r="28" fill="#ffffff" />
</svg>
